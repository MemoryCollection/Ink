<link rel="stylesheet" href="ink/assets/css/icons.css">
<style>
  :root {
    --paper: #f7faf9; --ink: #16211f; --ink-2: #4a5a57; --ink-3: #83938f;
    --rule: #d9e4e2; --accent: #9c3a5e; --accent-2: #cb526e;
    --serif: "Noto Serif SC", "Songti SC", SimSun, Georgia, serif;
    --sans: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  [data-theme="dark"] {
    --paper: #101716; --ink: #e2ecea; --ink-2: #9fb0ad; --ink-3: #6b7d79; --rule: #24312f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 44px 24px 90px; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 14px; -webkit-font-smoothing: antialiased; }
  .page { width: min(1000px, 100%); margin: 0 auto; }
  h1 { margin: 0 0 6px; font-family: var(--serif); font-size: 1.5rem; font-weight: 600; }
  .sub { margin: 0 0 26px; color: var(--ink-3); font-size: 13px; }
  .sub code { background: rgba(127,127,127,.13); padding: 1px 5px; border-radius: 4px; }
  .search { width: 100%; max-width: 320px; margin-bottom: 24px; padding: 9px 13px;
    border: 1px solid var(--rule); border-radius: 9px; background: transparent;
    color: var(--ink); font-size: 13px; outline: none; }
  .search:focus { border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 8px; }
  .ic { display: flex; flex-direction: column; align-items: center; gap: 9px;
    padding: 16px 6px 12px; border-radius: 10px; color: var(--ink-2);
    transition: background-color .2s, color .2s; }
  .ic i { font-size: 22px; color: var(--ink); }
  .ic span { font-size: 10.5px; font-family: ui-monospace, Consolas, monospace;
    color: var(--ink-3); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ic:hover { background: rgba(127,127,127,.09); color: var(--accent); }
  .ic.is-copied span { color: var(--accent); }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 12px);
    padding: 9px 18px; border-radius: 999px; background: var(--ink); color: var(--paper);
    font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
  .toast.is-show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>

<div class="toast" id="toast"></div>
<script>
(function () {
  var grid = document.getElementById('grid');
  var q = document.getElementById('q');
  var toast = document.getElementById('toast');
  var timer;

  function say(text) {
    toast.textContent = text;
    toast.classList.add('is-show');
    clearTimeout(timer);
    timer = setTimeout(function () { toast.classList.remove('is-show'); }, 1600);
  }

  q.addEventListener('input', function () {
    var k = q.value.trim().toLowerCase();
    Array.prototype.forEach.call(grid.children, function (b) {
      b.hidden = k !== '' && b.getAttribute('data-name').indexOf(k) < 0;
    });
  });

  grid.addEventListener('click', function (e) {
    var b = e.target.closest('.ic');
    if (!b) { return; }
    var name = b.getAttribute('data-name');
    var done = function () {
      b.classList.add('is-copied');
      setTimeout(function () { b.classList.remove('is-copied'); }, 900);
      say('已复制 ' + name);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(name).then(done, function () { say(name); });
    } else {
      var t = document.createElement('textarea');
      t.value = name;
      document.body.appendChild(t);
      t.select();
      try { document.execCommand('copy'); } catch (err) {}
      document.body.removeChild(t);
      done();
    }
  });

  var t;
  try { t = localStorage.getItem('ink-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
